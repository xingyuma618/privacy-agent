### model
model_name_or_path: ../models/Qwen2.5-Coder-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: nl2sql_sft
template: qwen
cutoff_len: 8192
max_samples: 500000000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/nl2sql_sft_qwen7b
logging_steps: 10
save_steps: 25
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 32
learning_rate: 2e-5
num_train_epochs: 2
lr_scheduler_type: cosine_with_restarts
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

