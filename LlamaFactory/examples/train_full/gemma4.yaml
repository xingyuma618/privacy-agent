### model
model_name_or_path: ../models/gemma-4-E4B-it
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: query_rewrite
template: gemma3
cutoff_len: 500000
max_samples: 500000000
preprocessing_num_workers: 16
dataloader_num_workers: 4
default_system: "这是一个query改写任务，我将提供给你用户的原始query，你需要将其转换为更通俗易懂的query"

### output
output_dir: saves/query_rewrite_v2_gemma
logging_steps: 10
save_steps: 25
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 32
learning_rate: 2e-5
num_train_epochs: 5
lr_scheduler_type: cosine_with_restarts
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

