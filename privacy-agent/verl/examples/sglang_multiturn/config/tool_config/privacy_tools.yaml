# API endpoints and model aliases come from environment variables.
tools:
- class_name: verl.tools.privacy_tools.QueryRewriteTool
  config:
    type: native
    temperature: 0
    request_timeout: 60
    max_retries: 3
  tool_schema:
    type: function
    function:
      name: query_rewrite
      description: Call this tool when the original query formulation is irregular.
        If called multiple times, a rewrite instruction (rewrite_instruction) can
        be passed to correct previous errors.
      parameters:
        type: object
        properties:
          query_to_rewrite:
            type: string
            description: The original query sentence to be rewritten
          rewrite_instruction:
            type: string
            description: (Optional) Additional rewrite requirements or instructions.
        required:
        - query_to_rewrite
- class_name: verl.tools.privacy_tools.EntityExtractTool
  config:
    type: native
    temperature: 0
    request_timeout: 60
    max_retries: 3
  tool_schema:
    type: function
    function:
      name: entity_extract
      description: Extract the Schema Linking entity information array.
      parameters:
        type: object
        properties:
          query_to_extract:
            type: string
        required:
        - query_to_extract
- class_name: verl.tools.privacy_tools.ApplyTypedMaskingTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: apply_typed_masking
      description: Simultaneously perform co-frequency table, column, and value masking
        replacement on the Query and Structured Schema at the underlying level.
      parameters:
        type: object
        properties:
          query:
            type: string
          entities:
            type: array
            items:
              type: object
        required:
        - query
        - entities
- class_name: verl.tools.privacy_tools.SQLGenerateTool
  config:
    type: native
    api_key: EMPTY
    temperature: 0
    request_timeout: 60
    max_retries: 3
  tool_schema:
    type: function
    function:
      name: sql_generate
      description: Generate the final SQL statement based on the masked query and
        masked Schema.
      parameters:
        type: object
        properties:
          masked_query:
            type: string
            description: The desensitized user question
          masked_schema_str:
            type: string
            description: The desensitized database Schema string
        required:
        - masked_query
        - masked_schema_str
- class_name: verl.tools.privacy_tools.SQLUnmaskTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: sql_unmask
      description: Restore the masked SQL to the real SQL statement.
      parameters:
        type: object
        properties:
          masked_sql:
            type: string
            description: The desensitized SQL generated by sql_generate
          unmask_dict:
            type: object
            description: The reverse mapping dictionary
        required:
        - masked_sql
        - unmask_dict
- class_name: verl.tools.privacy_tools.SQLExecuteCheckTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: execute_sql_check
      description: Check if the unmasked SQL can be executed successfully in the database.
        Returns 'Success' or an execution error message to help you repair the SQL.
      parameters:
        type: object
        properties:
          unmasked_sql:
            type: string
            description: The real SQL statement to check execution
        required:
        - unmasked_sql
